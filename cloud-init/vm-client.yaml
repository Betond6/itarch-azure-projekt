#cloud-config
# vm-client: teszteszközök telepítése és tűzfal beállítása az első indításkor.
# A GITHUB_FELHASZNALO részt írjátok át a saját GitHub-felhasználónevetekre, mielőtt beillesztitek!
package_update: true
package_upgrade: true
packages:
  - curl
  - jq
  - nmap
  - netcat-openbsd
  - postgresql-client
  - git
runcmd:
  - git clone https://github.com/GITHUB_FELHASZNALO/itarch-azure-projekt.git /home/azureuser/projekt
  - chown -R azureuser:azureuser /home/azureuser/projekt
  - chmod +x /home/azureuser/projekt/scripts/test.sh
  - ufw default deny incoming
  - ufw allow 22/tcp
  - ufw --force enable
